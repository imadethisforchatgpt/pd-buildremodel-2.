name: P&D 3.0 safety checks
on:
  push:
    branches:
      - feature/pd3-premium-experience
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pd3-cloud-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check P&D 3.0 JavaScript syntax
        run: |
          node --check js/pd3-cloud.js
          node --check js/pd3-cloud-core.js
          node --check js/pd3-firebase-config.js
      - name: Run cloud data safety regression tests
        run: node --test tests/pd3-safety.test.cjs
      - name: Install Java for isolated Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test tools
        run: |
          npm init -y
          npm install --no-save firebase-tools firebase @firebase/rules-unit-testing
      - name: Test Firestore owner isolation against emulator
        run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080}}}' > firebase.json
          ./node_modules/.bin/firebase emulators:exec --project demo-pd3-safety --only firestore "node --test tests/pd3-firestore-rules.test.cjs"
