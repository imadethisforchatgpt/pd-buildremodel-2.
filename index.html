const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(+n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(db));const btn=(s,fn,cls='')=>'<button class="btn '+cls+'" onclick="'+fn+'">'+s+'</button>';const title=(s,sub='')=>'<h1>'+s+'</h1><div class="muted">'+sub+'</div>';function go(t){tab=t;editing=null;render()}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="go(\''+t+'\')">'+t+'</button>').join('');let m=document.getElementById('main');if(tab==='Dashboard'){let unpaid=db.invoices.reduce((a,i)=>a+Math.max(0,(+i.total||0)-(+i.paid||0)),0);let billed=db.invoices.reduce((a,i)=>a+(+i.total||0),0);let paid=db.invoices.reduce((a,i)=>a+(+i.paid||0),0);let quoted=db.estimates.reduce((a,i)=>a+(+i.total||0),0);let pct=billed?Math.min(100,Math.round(paid/billed*100)):0;m.innerHTML='<div class="hero"><div><div class="eyebrow">P&D BUILD&REMODEL · BUSINESS HUB</div><h1>Welcome back 👋</h1><p>Your estimates, invoices, clients and projects—organized in one place.</p></div>'+btn('+ Create Estimate',"go('Estimates')")+'</div><div class="dash-heading">Business overview <small>Live test data · This device</small></div><div class="grid"><div class="stat"><div class="muted">📋 Estimates</div><strong>'+db.estimates.length+'</strong><span class="muted">'+money(quoted)+' quoted</span></div><div class="stat"><div class="muted">🧾 Invoices</div><strong>'+db.invoices.length+'</strong><span class="muted">'+money(billed)+' billed</span></div><div class="stat"><div class="muted">💳 Outstanding</div><strong>'+money(unpaid)+'</strong><span class="muted">Unpaid balance</span></div></div><div class="dash-heading">Quick actions <small>Get things done faster</small></div><div class="quick-grid"><button class="quick" onclick="go(\'Estimates\')"><span class="quick-icon">📄</span><strong>New Estimate</strong><span>Create a detailed quote →</span></button><button class="quick" onclick="go(\'Invoices\')"><span class="quick-icon">🧾</span><strong>Invoices</strong><span>Payments & balances →</span></button><button class="quick" onclick="go(\'Clients\')"><span class="quick-icon">👥</span><strong>Clients</strong><span>Customer directory →</span></button><button class="quick" onclick="go(\'Material Planner\')"><span class="quick-icon">📐</span><strong>Material Planner</strong><span>Job measurements →</span></button></div><div class="dash-heading">Your workspace <small>Recent activity & finances</small></div><div class="dash-split"><div class="panel"><div class="row"><h2>Recent activity</h2><span class="pill">Latest</span></div>'+([...db.estimates.map(x=>({name:x.client,type:'Estimate',total:x.total})),...db.invoices.map(x=>({name:x.client,type:'Invoice',total:x.total}))].slice(-5).reverse().map(x=>'<div class="entry row"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+x.type+'</div></div><strong>'+money(x.total)+'</strong></div>').join('')||'<div class="empty">No activity yet.<br>Create a sample estimate to begin.</div>')+'</div><div class="panel"><div class="section-eyebrow">Financial snapshot</div><h2>Payment progress</h2><div class="row"><span class="muted">Collected</span><strong>'+pct+'%</strong></div><div class="progress"><div style="width:'+pct+'%"></div></div><div class="metric"><span>Total invoiced</span><strong>'+money(billed)+'</strong></div><div class="metric"><span>Payments received</span><strong>'+money(paid)+'</strong></div><div class="metric"><span>Remaining balance</span><strong>'+money(unpaid)+'</strong></div><hr style="border:0;border-top:1px solid #e5edf5;margin:20px 0"><div class="section-eyebrow">Workspace</div><div class="metric"><span>Saved clients</span><strong>'+db.clients.length+'</strong></div><div class="metric"><span>Price templates</span><strong>'+db.templates.length+'</strong></div></div></div><div class="dashboard-foot">P&D 2.0 · Independent development preview · Original app and records remain untouched</div>'}
else if(tab==='Estimates'){let total=db.estimates.reduce((a,x)=>a+(+x.total||0),0);m.innerHTML=title('Estimates','Build, preview, and convert your project proposals')+'<div class="estimate-summary"><div><span class="muted">Total estimates</span><strong>'+db.estimates.length+'</strong></div><div><span class="muted">Total quoted</span><strong>'+money(total)+'</strong></div><div><span class="muted">Avg. estimate</span><strong>'+money(db.estimates.length?total/db.estimates.length:0)+'</strong></div></div><div class="toolbar">'+btn('+ New Estimate','estimateForm()','primary')+'<input class="search" id="esearch" placeholder="Search estimates..." oninput="filterCards(this.value,\'estimate-list\')"></div><div class="panel"><div class="section-head"><h2>All estimates</h2><span class="count">'+db.estimates.length+' records</span></div><div id="estimate-list">'+(db.estimates.map((x,i)=>'<div class="invoice-card filterable" data-filter="'+esc((x.client+' '+x.description).toLowerCase())+'"><div class="row"><div><span class="pill">EST-'+String(i+1).padStart(4,'0')+'</span><h2 style="margin:9px 0 4px">'+esc(x.client)+'</h2><div class="muted">'+esc(x.description||'Custom project')+'</div></div><strong style="font-size:19px">'+money(x.total)+'</strong></div><div class="actions">'+btn('Preview','previewDoc(\'estimate\','+i+')','small-action')+btn('Print / PDF','printEstimate('+i+')','small-action')+btn('Convert to Invoice','convert('+i+')','primary small-action')+'</div></div>').join('')||'<div class="empty">No estimates yet. Create your first sample proposal.</div>')+'</div></div>'}
else if(tab==='Invoices'){let due=db.invoices.reduce((a,x)=>a+Math.max(0,(+x.total||0)-(+x.paid||0)),0);m.innerHTML=title('Invoices','Keep payments and outstanding balances organized')+'<div class="estimate-summary"><div><span class="muted">Invoices</span><strong>'+db.invoices.length+'</strong></div><div><span class="muted">Outstanding</span><strong>'+money(due)+'</strong></div><div><span class="muted">Collected</span><strong>'+money(db.invoices.reduce((a,x)=>a+(+x.paid||0),0))+'</strong></div></div><div class="toolbar"><input class="search" placeholder="Search invoices..." oninput="filterCards(this.value,\'invoice-list\')"></div><div class="panel"><div class="section-head"><h2>Invoice register</h2><span class="count">'+db.invoices.length+' records</span></div><div id="invoice-list">'+(db.invoices.map((x,i)=>'<div class="invoice-card filterable" data-filter="'+esc((x.client+' '+x.description).toLowerCase())+'"><div class="row"><div><span class="pill">INV-'+String(i+1).padStart(4,'0')+'</span><h2 style="margin:9px 0 4px">'+esc(x.client)+'</h2><div class="muted">'+esc(x.description||'Custom project')+'</div></div><span class="badge-status '+(x.paid>=x.total?'':'due')+'">'+(x.paid>=x.total?'Paid':'Balance due')+'</span></div><div class="metric"><span>Invoice total</span><strong>'+money(x.total)+'</strong></div><div class="metric"><span>Paid</span><strong>'+money(x.paid)+'</strong></div><div class="metric"><span>Remaining</span><strong>'+money(x.total-x.paid)+'</strong></div><div class="actions">'+btn('Record Payment','payment('+i+')','primary small-action')+btn('Preview','previewDoc(\'invoice\','+i+')','small-action')+btn('Print / PDF','printDoc('+i+')','small-action')+'</div></div>').join('')||'<div class="empty">No invoices yet. Convert a saved estimate to create one.</div>')+'</div></div>'}
else if(tab==='Clients'){m.innerHTML=title('Clients','Your customer directory and job history')+'<div class="panel"><div class="section-head"><h2>Add a client</h2><span class="pill">Customer profile</span></div><div class="two"><div><label>Full name</label><input id="cname" placeholder="Customer name"></div><div><label>Phone</label><input id="cphone" placeholder="Phone number"></div></div><label>Email address</label><input id="cemail" type="email" placeholder="Email address"><div class="actions">'+btn('+ Save Client','addClient()','primary')+'</div></div><div class="panel"><div class="section-head"><h2>Client directory</h2><span class="count">'+db.clients.length+' clients</span></div><input class="search" placeholder="Find a customer..." oninput="filterCards(this.value,\'client-list\')"><div id="client-list">'+(db.clients.map(x=>'<div class="invoice-card filterable" data-filter="'+esc((x.name+' '+x.phone+' '+x.email).toLowerCase())+'"><div class="row"><div><strong>👤 '+esc(x.name)+'</strong><div class="client-note">'+esc(x.phone)+' · '+esc(x.email)+'</div></div><span class="pill">'+(db.estimates.filter(y=>y.client===x.name).length+db.invoices.filter(y=>y.client===x.name).length)+' documents</span></div></div>').join('')||'<div class="empty">No customers saved yet.</div>')+'</div></div>'}
else if(tab==='Material Planner'){m.innerHTML=title('Material Planner','Quick jobsite measurements')+'<div class="panel"><h2>Area calculator</h2><div class="two"><div><label>Length (feet)</label><input type="number" id="len" min="0" step="any"></div><div><label>Width (feet)</label><input type="number" id="wid" min="0" step="any"></div></div><label>Waste allowance</label><select id="waste"><option value="0">0%</option><option value=".05">5%</option><option value=".1" selected>10%</option><option value=".15">15%</option></select><div class="actions">'+btn('Calculate','calc()','primary')+'</div><div id="area" class="total">0 sq ft</div></div><div class="panel"><h2>More calculators</h2><p class="muted">Cabinets, flooring, drywall, paint, trim, and concrete are planned for this section.</p></div>'}
else if(tab==='Price Templates'){m.innerHTML=title('Price Templates','Reusable construction pricing')+'<div class="panel"><h2>Save a template</h2><label>Service</label><input id="tname" placeholder="Cabinet door fabrication"><label>Default price ($)</label><input id="tprice" type="number"><div class="actions">'+btn('Save Template','addTemplate()','primary')+'</div></div><div class="panel"><h2>Templates</h2>'+ (db.templates.map(x=>'<div class="entry row"><strong>'+esc(x.name)+'</strong><strong>'+money(x.price)+'</strong></div>').join('')||'<div class="empty">No templates yet.</div>')+'</div>'}
else if(tab==='Customer Care'){m.innerHTML=title('Customer Care','Review requests and private feedback')+'<div class="panel"><h2>Feedback tracker</h2><label>Sample customer</label><input id="fname"><label>Feedback</label><textarea id="fmsg"></textarea><div class="actions">'+btn('Save Feedback','addFeedback()','primary')+'</div></div><div class="panel"><h2>Feedback</h2>'+ (db.feedback.map(x=>'<div class="entry"><strong>'+esc(x.name)+'</strong> <span class="pill">New</span><p>'+esc(x.message)+'</p></div>').join('')||'<div class="empty">No feedback yet.</div>')+'</div>'}

function estimateForm(){document.getElementById('main').innerHTML=title('New Estimate','Create a sample estimate')+'<div class="panel"><h2>Customer & project</h2><label>Customer name</label><input id="eclient" placeholder="Customer name"><label>Project description</label><textarea id="edesc" placeholder="Describe the work"></textarea><h2>Line items</h2><div id="lines"></div><div class="actions">'+btn('+ Add Line','addLine()')+'</div><div id="etotal" class="total">$0.00</div><div class="actions">'+btn('Save Estimate','saveEstimate()','primary')+btn('Cancel',"go('Estimates')")+'</div></div>';addLine()}
function addLine(){let d=document.createElement('div');d.className='four';d.innerHTML='<div><label>Description</label><input class="ldesc" placeholder="Work or material"></div><div><label>Qty</label><input class="lqty" type="number" min="0" value="1" oninput="updateTotal()"></div><div><label>Unit price</label><input class="lprice" type="number" min="0" value="0" oninput="updateTotal()"></div><button class="btn" onclick="this.parentNode.remove();updateTotal()">×</button>';document.getElementById('lines').appendChild(d);updateTotal()}
function getLines(){return [...document.querySelectorAll('#lines .four')].map(d=>({description:d.querySelector('.ldesc').value,quantity:+d.querySelector('.lqty').value||0,price:+d.querySelector('.lprice').value||0}))}function updateTotal(){document.getElementById('etotal').textContent=money(getLines().reduce((a,x)=>a+x.quantity*x.price,0))}function saveEstimate(){let client=document.getElementById('eclient').value.trim();if(!client){alert('Enter a customer name');return}let lines=getLines();db.estimates.push({client,description:document.getElementById('edesc').value,lines,total:lines.reduce((a,x)=>a+x.quantity*x.price,0),date:new Date().toISOString()});save();go('Estimates')}function convert(i){db.invoices.push({...db.estimates[i],paid:0});save();go('Invoices')}function payment(i){let x=db.invoices[i],amount=Number(prompt('Payment amount ($)',String(Math.max(0,x.total-x.paid))));if(!Number.isFinite(amount)||amount<=0)return;x.paid=Math.min(x.total,x.paid+amount);save();render()}function addClient(){let name=document.getElementById('cname').value.trim();if(!name)return alert('Enter a name');db.clients.push({name,phone:document.getElementById('cphone').value,email:document.getElementById('cemail').value});save();render()}function addTemplate(){let name=document.getElementById('tname').value.trim();if(!name)return;db.templates.push({name,price:+document.getElementById('tprice').value||0});save();render()}function addFeedback(){let name=document.getElementById('fname').value.trim();if(!name)return;db.feedback.push({name,message:document.getElementById('fmsg').value});save();render()}function calc(){let a=(+document.getElementById('len').value||0)*(+document.getElementById('wid').value||0);document.getElementById('area').textContent=a.toFixed(2)+' sq ft · '+(a*(1+ +document.getElementById('waste').value)).toFixed(2)+' sq ft with waste'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='pd-2-test-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.estimates)||!Array.isArray(x.invoices)||!Array.isArray(x.clients))throw Error();if(confirm('Replace test data in this browser?')){db=x;save();render()}}catch(e){alert('Invalid test backup')}};r.readAsText(f)}function printDoc(i){let x=db.invoices[i],w=window.open('','_blank');if(!w)return alert('Allow popups to print');w.document.write('<title>Invoice</title><div style="font:16px system-ui;max-width:750px;margin:35px auto"><h1 style="color:#12395b">P&D Build&Remodel</h1><h2>INVOICE</h2><p>Customer: '+esc(x.client)+'</p><p>'+esc(x.description)+'</p><hr>'+x.lines.map(y=>'<p>'+esc(y.description)+' — '+y.quantity+' × '+money(y.price)+'</p>').join('')+'<hr><h2>Total: '+money(x.total)+'</h2><p>Paid: '+money(x.paid)+'</p><h3>Balance: '+money(x.total-x.paid)+'</h3></div>');w.document.close();w.print()}function filterCards(q,id){let root=document.getElementById(id);if(!root)return;root.querySelectorAll('.filterable').forEach(x=>x.style.display=x.dataset.filter.includes(q.toLowerCase())?'':'none')}function previewDoc(type,i){let x=(type==='estimate'?db.estimates:db.invoices)[i];if(!x)return;let lines=x.lines||[];let paid=+x.paid||0;document.getElementById('main').innerHTML='<div class="row"><div>'+title(type==='estimate'?'Estimate Preview':'Invoice Preview','Document '+String(i+1).padStart(4,'0'))+'</div>'+btn('← Back',type==='estimate'?"go('Estimates')":"go('Invoices')")+'</div><div class="preview-sheet"><div class="preview-header"><div><div class="preview-brand">P&D Build&Remodel</div><div class="muted">Precision & Detail</div><div class="muted">info@pdbuildremodel.com · (254) 535-7623</div></div><div><h2 style="text-transform:uppercase">'+type+'</h2><div class="muted">#'+String(i+1).padStart(4,'0')+'</div></div></div><div style="       history.innerHTML='<div class="row"><strong class="mini-heading">Payment history</strong><span class="muted">'+payments.length+' entries</span></div>'+(payments.map(p=>'<div class="history-row"><span>'+esc(p.date||'Undated')+' · '+esc(p.method||'Other')+'</span><strong>'+money(p.amount)+'</strong>'+(p.reference?' <span class="muted">#'+esc(p.reference)+'</span>':'')+'</div>').join('')||'<p class="muted">No itemized payments recorded yet'+(x.paid?' · Existing paid total: '+money(x.paid):'')+'.</p>');
      card.appendChild(history);
    });
  }
};
let pdEditingClient=null,pdEditingProject=null;
const pdOldAddClient=addClient;
addClient=function(){
 const name=document.getElementById('cname')?.value.trim();if(!name)return alert('Enter a customer name');
 const email=document.getElementById('cemail')?.value.trim()||'';
 if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert('Enter a valid email address');
 const item={name,phone:document.getElementById('cphone')?.value.trim()||'',email,address:document.getElementById('caddress')?.value.trim()||'',notes:document.getElementById('cnotes')?.value.trim()||''};
 if(pdEditingClient!==null){db.clients[pdEditingClient]={...db.clients[pdEditingClient],...item};pdEditingClient=null;save();render()}else{db.clients.push(item);save();render()}
};
function pdEditClient(i){
 const x=db.clients[i];if(!x)return;pdEditingClient=i;
 for(const [id,key] of [['cname','name'],['cphone','phone'],['cemail','email'],['caddress','address'],['cnotes','notes']]){const el=document.getElementById(id);if(el)el.value=x[key]||''}
 document.querySelector('#cname')?.focus();
 const b=document.querySelector('#cname')?.closest('.panel')?.querySelector('.actions button');if(b)b.textContent='Save Changes';
 window.scrollTo({top:0,behavior:'smooth'});
}
const pdOldAddProject=addProject;
addProject=function(){
 const name=document.getElementById('pname')?.value.trim();if(!name)return alert('Enter a project name');
 const start=document.getElementById('pstart')?.value||'',end=document.getElementById('pend')?.value||'';
 if(start&&end&&end<start)return alert('Target completion cannot be before start date');
 const item={name,client:document.getElementById('pclient')?.value.trim()||'',tasks:document.getElementById('ptasks')?.value.trim()||'',start,end,address:document.getElementById('paddress')?.value.trim()||'',budget:+document.getElementById('pbudget')?.value||0,status:'Planned'};
 if(item.budget<0)return alert('Budget cannot be negative');
 if(pdEditingProject!==null){db.projects[pdEditingProject]={...db.projects[pdEditingProject],...item,status:db.projects[pdEditingProject].status};pdEditingProject=null}else db.projects.push(item);
 save();render();
};
function pdEditProject(i){
 const x=db.projects[i];if(!x)return;pdEditingProject=i;
 for(const [id,key] of [['pname','name'],['pclient','client'],['ptasks','tasks'],['pstart','start'],['pend','end'],['paddress','address'],['pbudget','budget']]){const el=document.getElementById(id);if(el)el.value=x[key]||''}
 const b=document.querySelector('#pname')?.closest('.panel')?.querySelector('.actions button');if(b)b.textContent='Save Changes';
 document.querySelector('#pname')?.focus();window.scrollTo({top:0,behavior:'smooth'});
}
const pdOldGo=go;
go=function(t){pdEditingClient=null;pdEditingProject=null;pdOldGo(t)};
payment=function(i){
 const x=db.invoices[i];if(!x)return;
 const due=Math.max(0,(+x.total||0)-(+x.paid||0));
 if(due<=0)return alert('This invoice is already paid in full.');
 const raw=prompt('Payment received ($) · Remaining '+money(due),due.toFixed(2));
 if(raw===null)return;
 const amount=Number(raw);
 if(!Number.isFinite(amount)||amount<=0||amount>due+.001)return alert('Enter a valid payment amount no greater than '+money(due));
 const method=prompt('Payment method (Cash, Check, Card, Zelle, Bank transfer, Other)','Cash');
 if(method===null)return;
 const reference=prompt('Reference or note (optional)','');
 if(reference===null)return;
 x.payments=Array.isArray(x.payments)?x.payments:[];
 x.payments.push({amount:Math.round(amount*100)/100,date:new Date().toISOString().slice(0,10),method:method.trim()||'Other',reference:reference.trim()});
 x.paid=Math.min(+x.total||0,Math.round(((+x.paid||0)+amount)*100)/100);
 save();render();
};
const pdOldConvert=convert;
convert=function(i){
 const e=db.estimates[i];if(!e)return;
 const already=db.invoices.some(x=>x.sourceEstimate===i);
 if(already&&!confirm('An invoice already exists for this estimate. Create another?'))return;
 db.invoices.push({...e,sourceEstimate:i,paid:0,payments:[],invoiceDate:new Date().toISOString().slice(0,10)});
 save();go('Invoices');
};

const pdStage1EstimateForm=estimateForm;
estimateForm=function(){
 pdStage1EstimateForm();
 const name=document.getElementById('eclient');
 if(!name)return;
 const customers=db.clients||[];
 const select=document.createElement('select');
 select.id='pdSavedCustomer';
 select.setAttribute('aria-label','Select saved customer');
 select.innerHTML='<option value="">Select a saved customer (optional)</option>'+customers.map((c,i)=>'<option value="'+i+'">'+esc(c.name)+(c.address?' — '+esc(c.address):'')+'</option>').join('');
 select.addEventListener('change',()=>{
  if(select.value==='')return;
  const c=customers[Number(select.value)];if(!c)return;
  name.value=c.name||'';
  const addr=document.getElementById('pdJobAddress');if(addr)addr.value=c.address||'';
  const phone=document.getElementById('pdCustomerPhone');if(phone)phone.value=c.phone||'';
  const email=document.getElementById('pdCustomerEmail');if(email)email.value=c.email||'';
 });
 const label=document.createElement('label');label.textContent='Choose existing customer';
 name.parentNode.insertBefore(label,name);
 name.parentNode.insertBefore(select,name);
 name.insertAdjacentHTML('afterend','<div class="two"><div><label>Customer phone</label><input id="pdCustomerPhone" type="tel" autocomplete="tel" placeholder="Phone"></div><div><label>Customer email</label><input id="pdCustomerEmail" type="email" autocomplete="email" placeholder="Email"></div></div><label>Project address</label><input id="pdJobAddress" autocomplete="street-address" placeholder="Street address, city, ZIP">');
};

 x.customerEmail=document.getElementById('pdCustomerEmail')?.value.trim()||'';

const pdStage1DocumentHTML=documentHTML;
documentHTML=function(type,x,i){
 let html=pdStage1DocumentHTML(type,x,i);
 const details=[x.customerPhone,x.customerEmail,x.projectAddress].filter(Boolean).map(v=>'<p>'+esc(v)+'</p>').join('');
 if(details)html=html.replace('<strong>'+esc(x.client)+'</strong>','<strong>'+esc(x.client)+'</strong>'+details);
 return html;
};
