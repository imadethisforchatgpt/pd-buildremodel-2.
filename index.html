<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P&D 2.0 — Test</title><style>body{font:16px system-ui;margin:0;background:#f3f6fa;color:#162c46}header{background:#102e50;color:white;padding:22px}main{max-width:800px;margin:auto;padding:22px}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:12px;border:0;border-radius:9px;background:#173e69;color:white;cursor:pointer}section{background:white;padding:20px;margin-top:18px;border-radius:14px;box-shadow:0 2px 12px #132d4810}input{padding:12px;margin:6px 0;width:100%;border:1px solid #cad3df;border-radius:8px}.muted{color:#60718a}</style><header><h2>P&D Build&Remodel 2.0</h2><small>Separate test app • Sample data only</small></header><main><nav><button onclick="view('Dashboard')">Dashboard</button><button onclick="view('Estimates')">Estimates</button><button onclick="view('Invoices')">Invoices</button><button onclick="view('Customers')">Customers</button><button onclick="view('Material Planner')">Material Planner</button></nav><section id="content"></section></main><script>let estimates=JSON.parse(localStorage.getItem('pd2demo')||'[]');function view(t){let c=document.getElementById('content');if(t==='Dashboard'){c.innerHTML='<h2>Dashboard</h2><p>Estimates: '+estimates.length+'</p><p>Invoices: 0</p><p class="muted">This is a temporary test build. Your original P&D app and its records are untouched.</p>'}else if(t==='Estimates'){c.innerHTML='<h2>New estimate</h2><input id="client" placeholder="Sample client name"><input id="description" placeholder="Job description"><input id="price" type="number" placeholder="Price ($)"><button onclick="save()">Save sample estimate</button><div id="items"></div>';show()}else if(t==='Material Planner'){c.innerHTML='<h2>Material Planner</h2><p>Area calculator (square feet)</p><input id="length" type="number" placeholder="Length (feet)"><input id="width" type="number" placeholder="Width (feet)"><button onclick="document.getElementById(\'area\').textContent=(+document.getElementById(\'length\').value)*(+document.getElementById(\'width\').value)+\' sq ft\'">Calculate</button><p id="area"></p>'}else{c.innerHTML='<h2>'+t+'</h2><p class="muted">This section is coming in the next build. No real customer data is connected.</p>'}}function save(){estimates.push({client:document.getElementById('client').value,description:document.getElementById('description').value,price:document.getElementById('price').value});localStorage.setItem('pd2demo',JSON.stringify(estimates));show()}function show(){let el=document.getElementById('items');if(el)el.innerHTML='<h3>Sample estimates</h3>'+estimates.map(x=>'<p>'+x.client+' — '+x.description+' — $'+x.price+'</p>').join('')}view('Dashboard')</script></html>
