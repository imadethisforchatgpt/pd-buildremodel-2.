<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P&D 2.0 | Estimates & Invoices</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172c45;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#071d35;color:white;padding:18px max(16px,calc((100vw - 1060px)/2));display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900}.brand small{display:block;font-size:10px;font-weight:500;letter-spacing:1.3px;color:#b2c8dd}.tag{font-size:11px;background:#164976;padding:7px 10px;border-radius:30px}nav{background:#0b2948;display:flex;gap:2px;overflow:auto;padding:0 max(12px,calc((100vw - 1060px)/2))}nav button{background:none;color:#c9d9e9;border:0;padding:15px 12px;white-space:nowrap;font-size:13px}nav button.active{border-bottom:3px solid #55a7ee;color:white}main{max-width:1060px;margin:auto;padding:26px 16px 90px}h1{font-size:25px;margin:0 0 6px}h2{font-size:18px;margin:0 0 15px}.muted{color:#62758a;font-size:13px}.panel,.stat{background:white;border:1px solid #e0e8f0;border-radius:11px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #142f4c08}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{margin:0;padding:17px}.stat strong{display:block;font-size:24px;margin-top:9px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.btn{background:white;color:#103a62;border:1px solid #cbd8e6;border-radius:8px;padding:11px 14px;font-size:13px;font-weight:650}.primary{background:#1266ac;border-color:#1266ac;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.entry{padding:13px 0;border-top:1px solid #e8eef4}.pill{background:#e8f3ff;color:#1b639d;border-radius:30px;font-size:11px;padding:5px 8px}label{display:block;font-size:12px;font-weight:650;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #d0dce8;border-radius:7px;padding:11px;background:white;color:#172c45}textarea{min-height:85px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.four{display:grid;grid-template-columns:2fr .7fr 1fr 40px;gap:8px;align-items:end}.hint{padding:13px;background:#eaf4ff;border-left:3px solid #1681cc;font-size:12px;margin:14px 0;border-radius:4px}.total{text-align:right;background:#edf5fc;padding:16px;border-radius:8px;font-size:21px;font-weight:800}.empty{text-align:center;color:#748398;padding:28px}.doc{background:white;border:1px solid #dce5ef;border-radius:9px;padding:25px}.dochead{border-bottom:7px solid #0d3558;padding-bottom:14px}.doclogo{font-size:34px;font-weight:900;color:#105c9a}.mini{font-size:12px}@media(max-width:600px){.grid{gap:7px}.stat{padding:11px}.stat strong{font-size:19px}.two{grid-template-columns:1fr}.four{grid-template-columns:1.3fr .65fr .8fr 34px;gap:4px}.four input{padding:7px}main{padding-top:20px}header{padding:15px}.tag{font-size:9px}}</style><style id="pd-premium">
:root{--navy:#071d35;--blue:#1767aa;--muted:#6d7e91}body{background:linear-gradient(160deg,#e9f1f9 0%,#f5f8fc 35%,#f6f8fb 100%);min-height:100vh}header{background:linear-gradient(112deg,#061a30,#103c65 72%,#15517b);padding-top:23px;padding-bottom:23px;box-shadow:0 8px 24px #051b3420}.brand{letter-spacing:-.55px}.brand span{color:#e8f3ff}.brand small{letter-spacing:2px;margin-top:4px}.tag{background:#ffffff1c;border:1px solid #ffffff36;font-weight:750;letter-spacing:1px}nav{background:#0b2b4b;box-shadow:0 4px 16px #0c2b4812}nav button{font-weight:600;transition:background .2s,color .2s}nav button:hover{background:#ffffff10}nav button.active{background:#ffffff0b;border-bottom-color:#5cb5f8}main{max-width:1140px;padding-top:32px}h1{font-size:clamp(26px,3vw,33px);font-weight:850;letter-spacing:-1.15px;color:#102a45}h2{font-weight:800;letter-spacing:-.35px}.panel,.stat{border:1px solid #e0e8f1;box-shadow:0 8px 30px #143b5e0b;border-radius:16px}.panel{padding:24px;margin-top:20px}.stat{position:relative;overflow:hidden;padding:21px 20px;min-height:116px}.stat:before{content:'';position:absolute;right:-25px;top:-25px;width:100px;height:100px;border-radius:50%;background:#d5eaff80}.stat strong{font-size:29px;letter-spacing:-1px;color:#0d3458}.stat .muted{font-weight:650}.btn{border-radius:10px;padding:12px 17px;box-shadow:0 2px 7px #0e38500b;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px #0d355826}.btn.primary,.primary{background:linear-gradient(110deg,#1264a6,#1b80c9);border-color:#1264a6}.entry{padding:16px 0}.entry strong{color:#143654}.pill{font-weight:700}.hint{background:#edf6ff;border:1px solid #cce4f8;border-left:4px solid #2483c2;border-radius:10px;padding:16px}input,textarea,select{background:#fbfdff;transition:border .2s,box-shadow .2s}input:focus,textarea:focus,select:focus{outline:0;border-color:#4d9bd7;box-shadow:0 0 0 3px #b9dcf663}label{color:#344d65}.total{background:linear-gradient(100deg,#eaf4ff,#f5faff);color:#0d487b}.hero{background:linear-gradient(115deg,#092744,#145487 85%);border-radius:20px;color:white;padding:28px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden;box-shadow:0 14px 32px #0a3a6229}.hero:after{content:'';position:absolute;width:260px;height:260px;border:1px solid #ffffff1c;border-radius:50%;right:-75px;top:-110px;pointer-events:none}.hero h1{color:white;font-size:31px;margin:4px 0 8px}.hero p{margin:0;color:#d0e5f5;font-size:14px;max-width:480px}.hero .eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#8dd0ff}.hero .btn{background:white;color:#12466f;border:0;white-space:nowrap;position:relative;z-index:1}.dash-heading{margin:28px 0 13px;font-size:17px;font-weight:850;display:flex;align-items:center;justify-content:space-between}.dash-heading small{font-size:12px;color:#718398;font-weight:500}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick{border:1px solid #e1eaf2;border-radius:15px;background:white;padding:19px;text-align:left;box-shadow:0 6px 20px #163d6109;cursor:pointer;color:#183c5d}.quick:hover{border-color:#8dc4ef;transform:translateY(-2px)}.quick-icon{display:inline-flex;width:41px;height:41px;align-items:center;justify-content:center;background:#e8f3fc;border-radius:12px;font-size:21px;margin-bottom:12px}.quick strong{display:block;font-size:14px}.quick span:last-child{display:block;font-size:11px;color:#708298;margin-top:5px}.dash-split{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.dash-split .panel{margin-top:0}.progress{height:9px;border-radius:20px;background:#e7eef5;overflow:hidden;margin:12px 0}.progress>div{height:100%;border-radius:20px;background:linear-gradient(90deg,#1668a7,#42b0e9)}.metric{display:flex;justify-content:space-between;align-items:center;margin:13px 0;font-size:13px}.metric strong{color:#0d4b7d}.section-eyebrow{font-size:11px;color:#2d7db5;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:6px}.empty{border:1px dashed #cbdbe9;border-radius:12px;background:#f9fcff}.demo-mark{font-size:10px;font-weight:800;color:#5e809b;letter-spacing:1.2px}.dashboard-foot{font-size:12px;color:#667f94;margin:20px 0;text-align:center}@media(max-width:760px){.hero{padding:23px 20px}.hero h1{font-size:26px}.hero .btn{font-size:11px;padding:10px}.quick-grid{grid-template-columns:repeat(2,1fr)}.dash-split{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}.stat{min-height:106px}.stat strong{font-size:22px}.panel{padding:19px}}@media(max-width:390px){.hero{display:block}.hero .btn{margin-top:16px}.stat{padding:12px 9px}.stat strong{font-size:17px}.stat .muted{font-size:10px}.quick{padding:13px}.brand{font-size:18px}}
</style></head><body><header><div class="brand">P&D <span style="font-weight:500">Build&Remodel</span><small>ESTIMATES & INVOICES</small></div><span class="tag">2.0 TEST</span></header><nav id="nav"></nav><main id="main"></main><script>
const tabs=['Dashboard','Estimates','Invoices','Clients','Material Planner','Price Templates','Customer Care','Settings'];let tab='Dashboard',editing=null;
const key='pd2_test_records_v2';let db;try{db=JSON.parse(localStorage.getItem(key))||{clients:[],estimates:[],invoices:[],templates:[],feedback:[]}}catch(e){db={clients:[],estimates:[],invoices:[],templates:[],feedback:[]}}
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(+n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(db));const btn=(s,fn,cls='')=>'<button class="btn '+cls+'" onclick="'+fn+'">'+s+'</button>';const title=(s,sub='')=>'<h1>'+s+'</h1><div class="muted">'+sub+'</div>';function go(t){tab=t;editing=null;render()}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="go(\''+t+'\')">'+t+'</button>').join('');let m=document.getElementById('main');if(tab==='Dashboard'){let unpaid=db.invoices.reduce((a,i)=>a+Math.max(0,(+i.total||0)-(+i.paid||0)),0);let billed=db.invoices.reduce((a,i)=>a+(+i.total||0),0);let paid=db.invoices.reduce((a,i)=>a+(+i.paid||0),0);let quoted=db.estimates.reduce((a,i)=>a+(+i.total||0),0);let pct=billed?Math.min(100,Math.round(paid/billed*100)):0;m.innerHTML='<div class="hero"><div><div class="eyebrow">P&D BUILD&REMODEL · BUSINESS HUB</div><h1>Welcome back 👋</h1><p>Your estimates, invoices, clients and projects—organized in one place.</p></div>'+btn('+ Create Estimate',"go('Estimates')")+'</div><div class="dash-heading">Business overview <small>Live test data · This device</small></div><div class="grid"><div class="stat"><div class="muted">📋 Estimates</div><strong>'+db.estimates.length+'</strong><span class="muted">'+money(quoted)+' quoted</span></div><div class="stat"><div class="muted">🧾 Invoices</div><strong>'+db.invoices.length+'</strong><span class="muted">'+money(billed)+' billed</span></div><div class="stat"><div class="muted">💳 Outstanding</div><strong>'+money(unpaid)+'</strong><span class="muted">Unpaid balance</span></div></div><div class="dash-heading">Quick actions <small>Get things done faster</small></div><div class="quick-grid"><button class="quick" onclick="go(\'Estimates\')"><span class="quick-icon">📄</span><strong>New Estimate</strong><span>Create a detailed quote →</span></button><button class="quick" onclick="go(\'Invoices\')"><span class="quick-icon">🧾</span><strong>Invoices</strong><span>Payments & balances →</span></button><button class="quick" onclick="go(\'Clients\')"><span class="quick-icon">👥</span><strong>Clients</strong><span>Customer directory →</span></button><button class="quick" onclick="go(\'Material Planner\')"><span class="quick-icon">📐</span><strong>Material Planner</strong><span>Job measurements →</span></button></div><div class="dash-heading">Your workspace <small>Recent activity & finances</small></div><div class="dash-split"><div class="panel"><div class="row"><h2>Recent activity</h2><span class="pill">Latest</span></div>'+([...db.estimates.map(x=>({name:x.client,type:'Estimate',total:x.total})),...db.invoices.map(x=>({name:x.client,type:'Invoice',total:x.total}))].slice(-5).reverse().map(x=>'<div class="entry row"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+x.type+'</div></div><strong>'+money(x.total)+'</strong></div>').join('')||'<div class="empty">No activity yet.<br>Create a sample estimate to begin.</div>')+'</div><div class="panel"><div class="section-eyebrow">Financial snapshot</div><h2>Payment progress</h2><div class="row"><span class="muted">Collected</span><strong>'+pct+'%</strong></div><div class="progress"><div style="width:'+pct+'%"></div></div><div class="metric"><span>Total invoiced</span><strong>'+money(billed)+'</strong></div><div class="metric"><span>Payments received</span><strong>'+money(paid)+'</strong></div><div class="metric"><span>Remaining balance</span><strong>'+money(unpaid)+'</strong></div><hr style="border:0;border-top:1px solid #e5edf5;margin:20px 0"><div class="section-eyebrow">Workspace</div><div class="metric"><span>Saved clients</span><strong>'+db.clients.length+'</strong></div><div class="metric"><span>Price templates</span><strong>'+db.templates.length+'</strong></div></div></div><div class="dashboard-foot">P&D 2.0 · Independent development preview · Original app and records remain untouched</div>'}
else if(tab==='Estimates'){m.innerHTML=title('Estimates','Create and manage professional estimates')+'<div class="actions">'+btn('+ New Estimate','estimateForm()','primary')+'</div><div class="panel"><h2>Saved estimates</h2>'+ (db.estimates.map((x,i)=>'<div class="entry row"><div><strong>'+esc(x.client)+'</strong><div class="muted">'+esc(x.description||'Custom project')+'</div></div><div><strong>'+money(x.total)+'</strong> '+btn('Invoice','convert('+i+')')+'</div></div>').join('')||'<div class="empty">No estimates created yet.</div>')+'</div>'}
else if(tab==='Invoices'){m.innerHTML=title('Invoices','Track invoice totals and payments')+'<div class="panel"><h2>Invoices</h2>'+ (db.invoices.map((x,i)=>'<div class="entry"><div class="row"><strong>'+esc(x.client)+'</strong><span class="pill">'+(x.paid>=x.total?'Paid':'Balance '+money(x.total-x.paid))+'</span></div><div class="muted">'+esc(x.description)+' · '+money(x.total)+'</div><div class="actions">'+btn('Record Payment','payment('+i+')')+btn('Print','printDoc('+i+')')+'</div></div>').join('')||'<div class="empty">No invoices yet. Convert an estimate to get started.</div>')+'</div>'}
else if(tab==='Clients'){m.innerHTML=title('Clients','Customer directory')+'<div class="panel"><h2>Add sample client</h2><div class="two"><div><label>Name</label><input id="cname" placeholder="Customer name"></div><div><label>Phone</label><input id="cphone" placeholder="Phone number"></div></div><label>Email</label><input id="cemail" placeholder="Email address"><div class="actions">'+btn('Save Client','addClient()','primary')+'</div></div><div class="panel"><h2>Saved clients</h2>'+ (db.clients.map(x=>'<div class="entry"><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(x.phone)+' · '+esc(x.email)+'</div></div>').join('')||'<div class="empty">No clients yet.</div>')+'</div>'}
else if(tab==='Material Planner'){m.innerHTML=title('Material Planner','Quick jobsite measurements')+'<div class="panel"><h2>Area calculator</h2><div class="two"><div><label>Length (feet)</label><input type="number" id="len" min="0" step="any"></div><div><label>Width (feet)</label><input type="number" id="wid" min="0" step="any"></div></div><label>Waste allowance</label><select id="waste"><option value="0">0%</option><option value=".05">5%</option><option value=".1" selected>10%</option><option value=".15">15%</option></select><div class="actions">'+btn('Calculate','calc()','primary')+'</div><div id="area" class="total">0 sq ft</div></div><div class="panel"><h2>More calculators</h2><p class="muted">Cabinets, flooring, drywall, paint, trim, and concrete are planned for this section.</p></div>'}
else if(tab==='Price Templates'){m.innerHTML=title('Price Templates','Reusable construction pricing')+'<div class="panel"><h2>Save a template</h2><label>Service</label><input id="tname" placeholder="Cabinet door fabrication"><label>Default price ($)</label><input id="tprice" type="number"><div class="actions">'+btn('Save Template','addTemplate()','primary')+'</div></div><div class="panel"><h2>Templates</h2>'+ (db.templates.map(x=>'<div class="entry row"><strong>'+esc(x.name)+'</strong><strong>'+money(x.price)+'</strong></div>').join('')||'<div class="empty">No templates yet.</div>')+'</div>'}
else if(tab==='Customer Care'){m.innerHTML=title('Customer Care','Review requests and private feedback')+'<div class="panel"><h2>Feedback tracker</h2><label>Sample customer</label><input id="fname"><label>Feedback</label><textarea id="fmsg"></textarea><div class="actions">'+btn('Save Feedback','addFeedback()','primary')+'</div></div><div class="panel"><h2>Feedback</h2>'+ (db.feedback.map(x=>'<div class="entry"><strong>'+esc(x.name)+'</strong> <span class="pill">New</span><p>'+esc(x.message)+'</p></div>').join('')||'<div class="empty">No feedback yet.</div>')+'</div>'}
else{m.innerHTML=title('Settings','Test environment controls')+'<div class="panel"><h2>Data backup</h2><p class="muted">Download your test records as JSON. This is not a backup of the original P&D app.</p>'+btn('Export Test Data','exportData()','primary')+' '+btn('Import Test Data','document.getElementById(\'importfile\').click()')+'<input type="file" id="importfile" accept=".json" style="display:none" onchange="importData(this)"></div>'}}
function estimateForm(){document.getElementById('main').innerHTML=title('New Estimate','Create a sample estimate')+'<div class="panel"><h2>Customer & project</h2><label>Customer name</label><input id="eclient" placeholder="Customer name"><label>Project description</label><textarea id="edesc" placeholder="Describe the work"></textarea><h2>Line items</h2><div id="lines"></div><div class="actions">'+btn('+ Add Line','addLine()')+'</div><div id="etotal" class="total">$0.00</div><div class="actions">'+btn('Save Estimate','saveEstimate()','primary')+btn('Cancel',"go('Estimates')")+'</div></div>';addLine()}
function addLine(){let d=document.createElement('div');d.className='four';d.innerHTML='<div><label>Description</label><input class="ldesc" placeholder="Work or material"></div><div><label>Qty</label><input class="lqty" type="number" min="0" value="1" oninput="updateTotal()"></div><div><label>Unit price</label><input class="lprice" type="number" min="0" value="0" oninput="updateTotal()"></div><button class="btn" onclick="this.parentNode.remove();updateTotal()">×</button>';document.getElementById('lines').appendChild(d);updateTotal()}
function getLines(){return [...document.querySelectorAll('#lines .four')].map(d=>({description:d.querySelector('.ldesc').value,quantity:+d.querySelector('.lqty').value||0,price:+d.querySelector('.lprice').value||0}))}function updateTotal(){document.getElementById('etotal').textContent=money(getLines().reduce((a,x)=>a+x.quantity*x.price,0))}function saveEstimate(){let client=document.getElementById('eclient').value.trim();if(!client){alert('Enter a customer name');return}let lines=getLines();db.estimates.push({client,description:document.getElementById('edesc').value,lines,total:lines.reduce((a,x)=>a+x.quantity*x.price,0),date:new Date().toISOString()});save();go('Estimates')}function convert(i){db.invoices.push({...db.estimates[i],paid:0});save();go('Invoices')}function payment(i){let x=db.invoices[i],amount=Number(prompt('Payment amount ($)',String(Math.max(0,x.total-x.paid))));if(!Number.isFinite(amount)||amount<=0)return;x.paid=Math.min(x.total,x.paid+amount);save();render()}function addClient(){let name=document.getElementById('cname').value.trim();if(!name)return alert('Enter a name');db.clients.push({name,phone:document.getElementById('cphone').value,email:document.getElementById('cemail').value});save();render()}function addTemplate(){let name=document.getElementById('tname').value.trim();if(!name)return;db.templates.push({name,price:+document.getElementById('tprice').value||0});save();render()}function addFeedback(){let name=document.getElementById('fname').value.trim();if(!name)return;db.feedback.push({name,message:document.getElementById('fmsg').value});save();render()}function calc(){let a=(+document.getElementById('len').value||0)*(+document.getElementById('wid').value||0);document.getElementById('area').textContent=a.toFixed(2)+' sq ft · '+(a*(1+ +document.getElementById('waste').value)).toFixed(2)+' sq ft with waste'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='pd-2-test-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.estimates)||!Array.isArray(x.invoices)||!Array.isArray(x.clients))throw Error();if(confirm('Replace test data in this browser?')){db=x;save();render()}}catch(e){alert('Invalid test backup')}};r.readAsText(f)}function printDoc(i){let x=db.invoices[i],w=window.open('','_blank');if(!w)return alert('Allow popups to print');w.document.write('<title>Invoice</title><div style="font:16px system-ui;max-width:750px;margin:35px auto"><h1 style="color:#12395b">P&D Build&Remodel</h1><h2>INVOICE</h2><p>Customer: '+esc(x.client)+'</p><p>'+esc(x.description)+'</p><hr>'+x.lines.map(y=>'<p>'+esc(y.description)+' — '+y.quantity+' × '+money(y.price)+'</p>').join('')+'<hr><h2>Total: '+money(x.total)+'</h2><p>Paid: '+money(x.paid)+'</p><h3>Balance: '+money(x.total-x.paid)+'</h3></div>');w.document.close();w.print()}render();
</script></body></html>
